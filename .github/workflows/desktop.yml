name: Desktop app

# The app folder is gitignored: it is an output of source/build.py and an input
# to Tauri, so it is built here rather than committed. That keeps one source of
# truth — the website and the app come out of the same script on the same run,
# and the app cannot drift behind the site the way a copied folder would.

on:
  workflow_dispatch:
  push:
    branches: [app-shell]
    paths:
      - "source/**"
      - "src-tauri/**"
      - "assets/**"
      - "cities.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    # macos-latest, not macos-14. The first run was queued against the pinned
    # macos-14 label for fifteen minutes and then abandoned — "the job was not
    # acquired by Runner of type hosted even after multiple attempts", with a
    # capacity notice about macOS arm64. Nothing in the build failed; no step
    # ever ran. macos-latest is the default label and draws on a far larger
    # pool, and it is Apple silicon too, so the binary is still native.
    runs-on: macos-latest
    # A queue that is never going to be served should give up in a quarter of an
    # hour rather than holding the slot for six.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app target
        run: python3 source/build.py --app

      - name: Check the build actually produced something
        # A silent empty folder would become a window showing nothing, and the
        # first anyone would know is on opening the dmg.
        run: |
          test -f app/now.html            || { echo "app/now.html missing"; exit 1; }
          test -f app/cities.json         || { echo "app/cities.json missing"; exit 1; }
          test -f app/app-shell.css       || { echo "app/app-shell.css missing"; exit 1; }
          test -d app/assets/brand        || { echo "app/assets missing"; exit 1; }
          test ! -f app/sw.js             || { echo "a service worker got in"; exit 1; }
          echo "pages: $(ls app/*.html | wc -l)"
          grep -o 'window.__kBuild="[^"]*"' app/now.html | head -1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the bundle
        # No --target: build for the host. The runner is Apple silicon, so the
        # host target IS aarch64-apple-darwin, and not naming it means the job
        # cannot acquire a runner whose architecture disagrees with the flag.
        run: npx --yes @tauri-apps/cli@2 build --verbose

      - name: Name the artifact after the build it came from
        id: stamp
        run: |
          BID=$(grep -o 'window.__kBuild="[^"]*"' app/now.html | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "bid=${BID:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Nirayana-macOS-arm64-${{ steps.stamp.outputs.bid }}
          # Both layouts: target/release/... when building for the host,
          # target/<triple>/release/... if a target is ever named again.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (x64)
    # Same shape as the macOS job on purpose: the same build.py --app, the same
    # output check, the same Tauri CLI. The platform differences live in
    # src-tauri/tauri.windows.conf.json (bundle targets) and in the .win rules
    # of app-shell.css — not in a second workflow that would drift from this one.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app target
        run: python3 source/build.py --app

      - name: Check the build actually produced something
        shell: bash
        # bash, not PowerShell: the same script as the macOS job, so the two
        # cannot check different things by accident. It ships with the runner.
        run: |
          test -f app/now.html            || { echo "app/now.html missing"; exit 1; }
          test -f app/cities.json         || { echo "app/cities.json missing"; exit 1; }
          test -f app/app-shell.css       || { echo "app/app-shell.css missing"; exit 1; }
          test -d app/assets/brand        || { echo "app/assets missing"; exit 1; }
          test ! -f app/sw.js             || { echo "a service worker got in"; exit 1; }
          echo "pages: $(ls app/*.html | wc -l)"
          grep -o 'window.__kBuild="[^"]*"' app/now.html | head -1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Otherwise this job and the macOS one collide on one cache key and
          # each keeps evicting the other's artefacts.
          key: windows

      - name: Build the bundle
        # No --target, for the same reason as the macOS job: build for the host.
        # WiX is downloaded by the CLI on first use; nothing to install here.
        run: npx --yes @tauri-apps/cli@2 build --verbose

      - name: Name the artifact after the build it came from
        id: stamp
        shell: bash
        run: |
          BID=$(grep -o 'window.__kBuild="[^"]*"' app/now.html | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "bid=${BID:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Nirayana-Windows-x64-${{ steps.stamp.outputs.bid }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
