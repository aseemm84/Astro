[package]
name = "nirayana"
version = "0.1.0"
description = "Vedic astrology from Brihat Parashara Hora Shastra"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# macos-private-api is what allows a transparent window, and a transparent
# window is what lets the material behind it be seen at all. It goes in
# together with app.macOSPrivateApi in tauri.conf.json — Tauri rejects the
# build if the two disagree, which is why it was left out until now.
tauri = { version = "2.12", features = ["macos-private-api"] }
# Window size and position across launches. An application that forgets where it
# was is one of the smaller things that marks a window as not quite native.
tauri-plugin-window-state = "2.5"
# The platform, for the .mac / .win class on <html>. app-shell.js falls back to
# the user agent, so this is the authoritative answer rather than the only one.
tauri-plugin-os = "2.4"
# Reel Agent: the system save dialog, called from Rust so the page never holds a
# path. Opening a chart still uses the page's own file input, as before.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reel Agent's Connected mode (opt-in): the reader's key in the system keychain,
# and HTTPS made here in Rust so the key never re-enters the page. The same
# reqwest Tauri already carries; keyring with the native backends only.
reqwest = { version = "0.13", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# The 06:30 daily reel: a native "today's reel is ready" notification, and an
# optional launch-at-login agent. Both off until the reader turns them on.
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

# Liquid Glass on macOS 26+, NSVisualEffectView below it. Same
# raw-window-handle 0.6 as tauri, so the window handle passes between them.
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.8"

# Mica on Windows 11. The same crate: apply_mica returns
# Error::UnsupportedPlatformVersion below build 22000, so once again the error
# path is the version test and no comparison is written here to drift.
#
# There is deliberately NO acrylic fallback for Windows 10. The crate's own
# documentation warns that acrylic "has poor performance on Windows 10 v1903+
# and Windows 11 build 22000, the window will lag when resizing or dragging",
# and a window that stutters when dragged is a worse artefact than a flat
# background. On Windows 10 the chrome stays opaque, which the stylesheet is
# written to survive — see the 86%/92% mixes in app-shell.css.
[target."cfg(target_os = \"windows\")".dependencies]
window-vibrancy = "0.8"
# Reel Agent's offline system voice: Windows.Media.SpeechSynthesis. The same
# version Tauri already pulls in, so it adds features, not a second copy.
windows = { version = "0.62", features = ["Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections"] }

# The release profile matters here: the app is twenty-odd megabytes of content
# and the binary should not add meaningfully to it.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
